<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 750" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#475569" stroke-width="1.6" />
    </marker>
    <marker id="arrow-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#ffffff" stroke="#854d0e" stroke-width="1.6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="68" fill="#0f172a" />
  <text x="560" y="30" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">SƠ ĐỒ USE-CASE: ĐẶT ĐƠN HÀNG &amp; THANH TOÁN (CHUẨN ĐƠN NGUYÊN UML)</text>
  <text x="560" y="52" font-size="13" fill="#94a3b8" text-anchor="middle">Mỗi Use-Case đại diện cho 01 chức năng độc lập — Khớp 1-1 với REST API &amp; Kiến trúc OOP</text>

  <!-- System Boundary -->
  <rect x="210" y="88" width="680" height="630" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2" />
  <rect x="210" y="88" width="680" height="36" rx="14" fill="#e2e8f0" />
  <text x="550" y="112" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Hệ thống Đặt Cà Phê Không Tiền Mặt — BrewLite</text>

  <!-- PRIMARY ACTOR: Khách hàng (Left) -->
  <g transform="translate(95, 360)">
    <circle cx="0" cy="-35" r="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.2"/>
    <line x1="0" y1="-17" x2="0" y2="25" stroke="#0284c7" stroke-width="2.2"/>
    <line x1="-24" y1="-3" x2="24" y2="-3" stroke="#0284c7" stroke-width="2.2"/>
    <line x1="0" y1="25" x2="-18" y2="55" stroke="#0284c7" stroke-width="2.2"/>
    <line x1="0" y1="25" x2="18" y2="55" stroke="#0284c7" stroke-width="2.2"/>
    <text x="0" y="78" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">Khách hàng</text>
    <text x="0" y="95" font-size="11" fill="#0284c7" text-anchor="middle">(Primary Actor)</text>
  </g>

  <!-- SECONDARY ACTOR: Cổng thanh toán (Right) -->
  <g transform="translate(1015, 445)">
    <rect x="-65" y="-35" width="130" height="65" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-12" font-size="11" font-weight="bold" fill="#a16207" text-anchor="middle">&lt;&lt;System Actor&gt;&gt;</text>
    <text x="0" y="6" font-size="13" font-weight="bold" fill="#854d0e" text-anchor="middle">Cổng Thanh Toán</text>
    <text x="0" y="22" font-size="11" fill="#a16207" text-anchor="middle">(Mock Gateway)</text>
  </g>

  <!-- ==================== GROUP 1: ĐẶT ĐƠN HÀNG ==================== -->
  <!-- UC-01: Đặt đơn hàng (POST /orders) -->
  <g filter="url(#shadow)">
    <ellipse cx="360" cy="255" rx="105" ry="38" fill="#dcfce7" stroke="#15803d" stroke-width="2.2"/>
    <text x="360" y="251" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">UC-01: Đặt đơn hàng</text>
    <text x="360" y="269" font-size="11.5" font-weight="bold" fill="#166534" text-anchor="middle">(POST /orders — PENDING)</text>
  </g>

  <!-- UC-05: Áp dụng mã khuyến mãi -->
  <g filter="url(#shadow)">
    <ellipse cx="360" cy="155" rx="100" ry="30" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="360" y="152" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">UC-05: Áp dụng mã</text>
    <text x="360" y="168" font-size="11" fill="#475569" text-anchor="middle">khuyến mãi (Promotion)</text>
  </g>

  <!-- UC-04: Kiểm tra tồn kho -->
  <g filter="url(#shadow)">
    <ellipse cx="670" cy="185" rx="105" ry="32" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
    <text x="670" y="181" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">UC-04: Kiểm tra tồn kho</text>
    <text x="670" y="198" font-size="11" fill="#475569" text-anchor="middle">(Optimistic Locking)</text>
  </g>

  <!-- UC-03: Xác thực tài khoản (JWT Guard) -->
  <g filter="url(#shadow)">
    <ellipse cx="670" cy="315" rx="105" ry="32" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
    <text x="670" y="311" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">UC-03: Xác thực tài khoản</text>
    <text x="670" y="328" font-size="11" fill="#475569" text-anchor="middle">(JWT Guard)</text>
  </g>

  <!-- ==================== GROUP 2: THANH TOÁN ĐƠN HÀNG ==================== -->
  <!-- UC-02: Thanh toán đơn hàng (POST /payments) -->
  <g filter="url(#shadow)">
    <ellipse cx="360" cy="445" rx="108" ry="40" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2"/>
    <text x="360" y="440" font-size="13" font-weight="bold" fill="#854d0e" text-anchor="middle">UC-02: Thanh toán đơn hàng</text>
    <text x="360" y="458" font-size="11.5" font-weight="bold" fill="#a16207" text-anchor="middle">(POST /payments)</text>
  </g>

  <!-- UC-02a: Thanh toán bằng Ví điện tử -->
  <g filter="url(#shadow)">
    <ellipse cx="660" cy="415" rx="102" ry="32" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
    <text x="660" y="411" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">UC-02a: Thanh toán bằng</text>
    <text x="660" y="428" font-size="11" fill="#b45309" text-anchor="middle">Ví điện tử (WALLET)</text>
  </g>

  <!-- UC-02b: Thanh toán bằng Thẻ ngân hàng -->
  <g filter="url(#shadow)">
    <ellipse cx="660" cy="505" rx="102" ry="32" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
    <text x="660" y="501" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">UC-02b: Thanh toán bằng</text>
    <text x="660" y="518" font-size="11" fill="#b45309" text-anchor="middle">Thẻ ngân hàng (CARD)</text>
  </g>

  <!-- UC-06: Cộng điểm tích lũy -->
  <g filter="url(#shadow)">
    <ellipse cx="660" cy="605" rx="105" ry="32" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
    <text x="660" y="601" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">UC-06: Cộng điểm tích lũy</text>
    <text x="660" y="618" font-size="11" fill="#475569" text-anchor="middle">(Loyalty Points khi PAID)</text>
  </g>

  <!-- UC-07: Thử thanh toán lại -->
  <g filter="url(#shadow)">
    <ellipse cx="360" cy="610" rx="102" ry="32" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.6"/>
    <text x="360" y="606" font-size="12" font-weight="bold" fill="#9f1239" text-anchor="middle">UC-07: Thử thanh toán lại</text>
    <text x="360" y="623" font-size="11" fill="#be123c" text-anchor="middle">(khi PAYMENT_FAILED)</text>
  </g>

  <!-- ==================== LINES & ARROWS ==================== -->
  <!-- Customer -> UC-01 & UC-02 -->
  <line x1="130" y1="340" x2="262" y2="270" stroke="#0284c7" stroke-width="2.2" />
  <line x1="130" y1="370" x2="255" y2="435" stroke="#0284c7" stroke-width="2.2" />

  <!-- UC-05 ..> UC-01 (extend) -->
  <line x1="360" y1="185" x2="360" y2="217" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-open)" />
  <rect x="323" y="191" width="74" height="16" fill="#f8fafc" rx="3"/>
  <text x="360" y="203" font-size="10.5" font-weight="bold" fill="#475569" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC-01 ..> UC-04 (include: Kiểm tra tồn kho) -->
  <line x1="455" y1="235" x2="575" y2="200" stroke="#475569" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-open)" />
  <rect x="478" y="205" width="74" height="17" fill="#f8fafc" rx="3"/>
  <text x="515" y="217" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-01 ..> UC-03 (include: Xác thực JWT) -->
  <line x1="458" y1="272" x2="575" y2="298" stroke="#475569" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-open)" />
  <rect x="478" y="276" width="74" height="17" fill="#f8fafc" rx="3"/>
  <text x="515" y="288" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-02 ..> UC-03 (include: Xác thực JWT) -->
  <line x1="435" y1="416" x2="590" y2="338" stroke="#475569" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-open)" />
  <rect x="475" y="366" width="74" height="17" fill="#f8fafc" rx="3"/>
  <text x="512" y="378" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-02 <|-- UC-02a (Inheritance Wallet) -->
  <line x1="558" y1="420" x2="468" y2="436" stroke="#854d0e" stroke-width="1.8" marker-end="url(#arrow-inherit)" />

  <!-- UC-02 <|-- UC-02b (Inheritance Card) -->
  <line x1="562" y1="496" x2="462" y2="462" stroke="#854d0e" stroke-width="1.8" marker-end="url(#arrow-inherit)" />

  <!-- UC-02 ..> UC-06 (include: Cộng điểm tích lũy) -->
  <line x1="425" y1="476" x2="585" y2="582" stroke="#475569" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-open)" />
  <rect x="468" y="522" width="74" height="17" fill="#f8fafc" rx="3"/>
  <text x="505" y="534" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-07 ..> UC-02 (extend: Thử thanh toán lại) -->
  <line x1="360" y1="578" x2="360" y2="485" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-open)" />
  <rect x="322" y="525" width="76" height="17" fill="#f8fafc" rx="3"/>
  <text x="360" y="537" font-size="10.5" font-weight="bold" fill="#be123c" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC-02a & UC-02b -> Gateway -->
  <line x1="762" y1="418" x2="950" y2="440" stroke="#ca8a04" stroke-width="2" />
  <line x1="762" y1="502" x2="950" y2="455" stroke="#ca8a04" stroke-width="2" />
</svg>
