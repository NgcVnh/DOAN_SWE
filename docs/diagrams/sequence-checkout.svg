<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 960" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <!-- Drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <rect x="0" y="0" width="1180" height="70" fill="#0f172a" />
  <text x="590" y="32" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">SƠ ĐỒ TRÌNH TỰ THANH TOÁN (CHECKOUT SEQUENCE DIAGRAM)</text>
  <text x="590" y="54" font-size="13" fill="#94a3b8" text-anchor="middle">Đồ án BrewLite — Luồng Đặt Hàng &amp; Thanh Toán Không Tiền Mặt (Task 8 &amp; Task 10)</text>

  <!-- NestJS Box Container -->
  <rect x="400" y="85" width="460" height="840" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="630" y="108" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">HỆ THỐNG BACKEND (NestJS API)</text>

  <!-- Lifeline Vertical Dashed Lines -->
  <!-- 1. User: x=110 -->
  <line x1="110" y1="170" x2="110" y2="880" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <!-- 2. Cart: x=270 -->
  <line x1="270" y1="170" x2="270" y2="880" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <!-- 3. Controller: x=470 -->
  <line x1="470" y1="170" x2="470" y2="880" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <!-- 4. Service: x=630 -->
  <line x1="630" y1="170" x2="630" y2="880" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <!-- 5. Strategy: x=790 -->
  <line x1="790" y1="170" x2="790" y2="880" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <!-- 6. Database: x=1020 -->
  <line x1="1020" y1="170" x2="1020" y2="880" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Participant Boxes (Top) -->
  <!-- Khách hàng -->
  <g filter="url(#shadow)">
    <rect x="35" y="125" width="150" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="110" y="145" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">Khách hàng</text>
    <text x="110" y="161" font-size="11" fill="#0284c7" text-anchor="middle">(Next.js Web UI)</text>
  </g>
  <!-- Giỏ hàng -->
  <g filter="url(#shadow)">
    <rect x="200" y="125" width="140" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="270" y="145" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Giỏ hàng</text>
    <text x="270" y="161" font-size="11" fill="#64748b" text-anchor="middle">(Client Cart Store)</text>
  </g>
  <!-- PaymentsController -->
  <g filter="url(#shadow)">
    <rect x="390" y="125" width="160" height="46" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="470" y="145" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">PaymentsController</text>
    <text x="470" y="161" font-size="11" fill="#64748b" text-anchor="middle">POST /payments</text>
  </g>
  <!-- PaymentsService -->
  <g filter="url(#shadow)">
    <rect x="560" y="125" width="140" height="46" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="630" y="145" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">PaymentsService</text>
    <text x="630" y="161" font-size="11" fill="#64748b" text-anchor="middle">Nghiệp vụ cốt lõi</text>
  </g>
  <!-- PaymentStrategy (OOP) -->
  <g filter="url(#shadow)">
    <rect x="715" y="125" width="150" height="46" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="790" y="145" font-size="13" font-weight="bold" fill="#854d0e" text-anchor="middle">PaymentStrategy</text>
    <text x="790" y="161" font-size="11" fill="#a16207" text-anchor="middle">(OOP: Wallet / Card)</text>
  </g>
  <!-- Database PostgreSQL -->
  <g filter="url(#shadow)">
    <rect x="940" y="125" width="160" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1020" y="145" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">PostgreSQL</text>
    <text x="1020" y="161" font-size="11" fill="#16a34a" text-anchor="middle">(Prisma ORM)</text>
  </g>

  <!-- Step 1: User -> Controller -->
  <line x1="110" y1="205" x2="470" y2="205" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="150" y="190" width="280" height="18" fill="#ffffff" rx="4"/>
  <text x="290" y="203" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">1. POST /payments {orderId, method, idempotencyKey}</text>

  <!-- Step 2: Controller -> Service -->
  <line x1="470" y1="240" x2="630" y2="240" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="495" y="226" width="120" height="16" fill="#ffffff" rx="4"/>
  <text x="550" y="238" font-size="12" fill="#334155" text-anchor="middle">2. processPayment(dto)</text>

  <!-- Step 3: Service -> DB (Check Idempotency) -->
  <line x1="630" y1="280" x2="1020" y2="280" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="670" y="266" width="310" height="16" fill="#ffffff" rx="4"/>
  <text x="825" y="278" font-size="12" fill="#0f172a" text-anchor="middle">3. findUnique(idempotencyKey) — Chống trừ tiền 2 lần</text>

  <!-- Step 4: DB -> Service -->
  <line x1="1020" y1="310" x2="630" y2="310" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)" />
  <text x="825" y="305" font-size="11" fill="#64748b" text-anchor="middle">Key hợp lệ (chưa thanh toán trước đó)</text>

  <!-- Step 5: Service -> DB (Find Order & State Machine) -->
  <line x1="630" y1="350" x2="1020" y2="350" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="660" y="336" width="330" height="16" fill="#ffffff" rx="4"/>
  <text x="825" y="348" font-size="12" fill="#0f172a" text-anchor="middle">4. findUnique(orderId) &amp; Kiểm tra Order State (PENDING)</text>

  <!-- Step 6: DB -> Service -->
  <line x1="1020" y1="380" x2="630" y2="380" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)" />
  <text x="825" y="375" font-size="11" fill="#64748b" text-anchor="middle">Thông tin Order &amp; Total tiền</text>

  <!-- Step 7: Service -> Strategy (Polymorphism) -->
  <line x1="630" y1="420" x2="790" y2="420" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="640" y="405" width="140" height="18" fill="#fef9c3" rx="4" stroke="#eab308" stroke-width="0.8"/>
  <text x="710" y="418" font-size="12" font-weight="bold" fill="#854d0e" text-anchor="middle">5. strategy.charge(amount)</text>

  <!-- ==================== ALT BLOCK ==================== -->
  <rect x="60" y="455" width="1060" height="400" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="60" y="455" width="55" height="26" rx="6" fill="#64748b" />
  <text x="87" y="472" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">alt</text>

  <!-- CASE 1: SUCCESS -->
  <text x="130" y="473" font-size="13" font-weight="bold" fill="#047857">[ Nhánh 1: Thanh toán THÀNH CÔNG (MockSuccess = true) ]</text>

  <!-- 1.1 Strategy -> Service -->
  <line x1="790" y1="505" x2="630" y2="505" stroke="#059669" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-green)" />
  <rect x="640" y="493" width="140" height="15" fill="#ecfdf5" rx="3"/>
  <text x="710" y="504" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">{success: true, ref: 'WALLET_...'}</text>

  <!-- 1.2 Service -> DB ($transaction) -->
  <line x1="630" y1="540" x2="1020" y2="540" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="660" y="525" width="340" height="30" fill="#ecfdf5" rx="4" stroke="#a7f3d0" stroke-width="1"/>
  <text x="830" y="538" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">6. $transaction: Tạo Payment(SUCCESS) + Đổi Order(PAID)</text>
  <text x="830" y="551" font-size="11" fill="#047857" text-anchor="middle">+ Tích lũy Loyalty Points vào bảng User</text>

  <!-- 1.3 DB -> Service -->
  <line x1="1020" y1="575" x2="630" y2="575" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-green)" />
  <text x="825" y="571" font-size="11" fill="#047857" text-anchor="middle">Transaction Committed thành công (ACID)</text>

  <!-- 1.4 Service -> Controller -->
  <line x1="630" y1="605" x2="470" y2="605" stroke="#059669" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-green)" />
  <text x="550" y="600" font-size="11" fill="#047857" text-anchor="middle">{orderStatus: 'PAID'}</text>

  <!-- 1.5 Controller -> User -->
  <line x1="470" y1="635" x2="110" y2="635" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="180" y="621" width="220" height="18" fill="#ecfdf5" rx="4" stroke="#a7f3d0" stroke-width="1"/>
  <text x="290" y="634" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">7. HTTP 200 OK: Trạng thái PAID</text>

  <!-- 1.6 User -> Cart -->
  <line x1="110" y1="660" x2="270" y2="660" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <rect x="125" y="650" width="130" height="14" fill="#ffffff"/>
  <text x="190" y="659" font-size="10.5" font-weight="bold" fill="#047857" text-anchor="middle">Xóa giỏ (clearCart)</text>

  <rect x="80" y="675" width="220" height="20" rx="4" fill="#047857" />
  <text x="190" y="689" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Chuyển sang màn hình Xác nhận (#5)</text>

  <!-- DIVIDER DASHED LINE -->
  <line x1="60" y1="710" x2="1120" y2="710" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- CASE 2: FAILED -->
  <text x="130" y="730" font-size="13" font-weight="bold" fill="#e11d48">[ Nhánh 2: Thanh toán THẤT BẠI (MockSuccess = false hoặc Lỗi thẻ/ví) ]</text>

  <!-- 2.1 Strategy -> Service -->
  <line x1="790" y1="755" x2="630" y2="755" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-red)" />
  <rect x="640" y="743" width="140" height="15" fill="#fff1f2" rx="3"/>
  <text x="710" y="754" font-size="11" font-weight="bold" fill="#be123c" text-anchor="middle">{success: false, error}</text>

  <!-- 2.2 Service -> DB ($transaction) -->
  <line x1="630" y1="785" x2="1020" y2="785" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow-red)" />
  <rect x="660" y="771" width="340" height="26" fill="#fff1f2" rx="4" stroke="#fecdd3" stroke-width="1"/>
  <text x="830" y="784" font-size="12" font-weight="bold" fill="#9f1239" text-anchor="middle">6. $transaction: Tạo Payment(FAILED) + Đổi Order(PAYMENT_FAILED)</text>

  <!-- 2.3 DB -> Service -->
  <line x1="1020" y1="810" x2="630" y2="810" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)" />
  <text x="825" y="806" font-size="11" fill="#be123c" text-anchor="middle">Đã cập nhật trạng thái PAYMENT_FAILED</text>

  <!-- 2.4 Service -> Controller -> User -->
  <line x1="630" y1="835" x2="110" y2="835" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow-red)" />
  <rect x="180" y="821" width="280" height="18" fill="#fff1f2" rx="4" stroke="#fecdd3" stroke-width="1"/>
  <text x="320" y="834" font-size="12" font-weight="bold" fill="#9f1239" text-anchor="middle">7. Trả về kết quả: {orderStatus: 'PAYMENT_FAILED'}</text>

  <!-- 2.5 User action: Keep cart -->
  <rect x="80" y="855" width="220" height="20" rx="4" fill="#be123c" />
  <text x="190" y="869" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GIỮ NGUYÊN giỏ hàng &amp; Nút "Thử lại"</text>

  <!-- Participant Boxes (Bottom) -->
  <g filter="url(#shadow)">
    <rect x="35" y="890" width="150" height="38" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="110" y="914" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Khách hàng</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="200" y="890" width="140" height="38" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="270" y="914" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Giỏ hàng</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="390" y="890" width="160" height="38" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="470" y="914" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">PaymentsController</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="560" y="890" width="140" height="38" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="630" y="914" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">PaymentsService</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="715" y="890" width="150" height="38" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="790" y="914" font-size="12" font-weight="bold" fill="#854d0e" text-anchor="middle">PaymentStrategy</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="940" y="890" width="160" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1020" y="914" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">PostgreSQL</text>
  </g>
</svg>
