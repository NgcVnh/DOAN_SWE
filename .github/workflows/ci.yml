name: BrewLite CI/CD Pipeline

on:
  push:
    branches: [main, master, develop, Nhanbranch, DucBranch, quy-branch]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package.json
            apps/web/package.json

      - name: Install Backend Dependencies
        run: npm --prefix apps/api install

      - name: Generate Prisma Client
        run: npm --prefix apps/api run prisma:generate

      - name: Build Backend
        run: npm --prefix apps/api run build

      - name: Run Backend Unit Tests
        run: npm --prefix apps/api run test

      - name: Install Frontend Dependencies
        run: npm --prefix apps/web install

      - name: Build Frontend
        run: npm --prefix apps/web run build
