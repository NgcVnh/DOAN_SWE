name: BrewLite CI/CD Pipeline

on:
  push:
    branches: [main, master, develop, Nhanbranch]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-ci:
    name: Backend CI (apps/api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/api/package.json'

      - name: Install Dependencies
        run: npm --prefix apps/api install

      - name: Build Backend
        run: npm --prefix apps/api run build

      - name: Run Backend Tests
        run: npm --prefix apps/api run test

  frontend-ci:
    name: Frontend CI (apps/web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Frontend Structure
        run: |
          test -d apps/web/src
          echo "Frontend src directory verified"
