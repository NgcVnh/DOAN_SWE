version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: brewlite_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: brewlite_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    container_name: brewlite_api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:123@db:5432/brewlite_db?schema=public
    ports:
      - '3001:3001'

  web:
    build:
      context: ./apps/web
    container_name: brewlite_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'

volumes:
  pgdata:

